version: '3.8'

services:
  user_service:
    volumes:
      - ../services/user_service:/app/services/user_service
      - ../shared:/app/shared
      - ../Cargo.toml:/app/Cargo.toml
      - ../Cargo.lock:/app/Cargo.lock
    command: sh -c "cd /app/services/user_service && cargo watch -x run"
    # Alternative for hot-reloading with 'air' (if installed in builder and configured for Rust):
    # command: sh -c "cd /app/services/user_service && air"

  driver_service:
    volumes:
      - ../services/driver_service:/app/services/driver_service
      - ../shared:/app/shared
      - ../Cargo.toml:/app/Cargo.toml
      - ../Cargo.lock:/app/Cargo.lock
    command: sh -c "cd /app/services/driver_service && cargo watch -x run"

  ride_service:
