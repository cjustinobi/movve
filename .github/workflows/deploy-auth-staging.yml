name: Deploy Auth Service - Staging

on:
  push:
    branches: [ "staging" ]
    paths:
      - 'apps/auth/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-auth-staging.yml'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust environment
        run: |
          if [ ! -f "$HOME/.cargo/env" ]; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y
          fi
          source $HOME/.cargo/env
          rustc --version
          cargo --version

      - name: Build auth-service in release mode
        run: |
          source $HOME/.cargo/env
          cargo build --release --bin auth

      - name: Stop auth service
        run: echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl stop movve-auth || true

      - name: Copy binary and migrations to VPS
        run: |
          # Create directories on VPS
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p /opt/movve/bin
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p /opt/movve/auth
          
          # Copy binary
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp target/release/auth /opt/movve/bin/auth-service
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x /opt/movve/bin/auth-service
          
          # Copy migrations and env
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S rm -rf /opt/movve/auth/migrations
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp -r apps/auth/migrations /opt/movve/auth/migrations
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp /opt/movve/.env /opt/movve/auth/.env

      - name: Run Diesel migrations on VPS
        run: |
          source /opt/movve/.env
          export AUTH_DATABASE_URL=$AUTH_DATABASE_URL
          
          # Install Diesel CLI temporarily (only if not installed)
          if ! command -v diesel &> /dev/null; then
            source $HOME/.cargo/env
            cargo install diesel_cli --no-default-features --features postgres
          fi
          
          diesel migration run --migration-dir /opt/movve/auth/migrations --database-url $AUTH_DATABASE_URL

      - name: Start auth service
        run: echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl start movve-auth

      - name: Wait for service to start
        run: sleep 3

      - name: Check service status
        run: echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl status movve-auth --no-pager
