name: Deploy Driver Service - Staging

on:
  push:
    branches: [ "staging" ]
    paths:
      - 'apps/driver/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-driver-staging.yml'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust environment
        run: |
          if [ ! -f "$HOME/.cargo/env" ]; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y
          fi
          source $HOME/.cargo/env
          rustc --version
          cargo --version

      - name: Ensure incremental build
        run: |
          source $HOME/.cargo/env
          export CARGO_INCREMENTAL=1

      - name: Build driver-service in release mode
        run: |
          source $HOME/.cargo/env
          cargo build --release --bin driver

      - name: Stop driver service
        run: echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl stop movve-driver || true

      - name: Copy binary and migrations to VPS
        run: |
          # Create directories on VPS
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p /opt/movve/bin
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p /opt/movve/driver
          
          # Copy binary
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp target/release/driver /opt/movve/bin/driver-service
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x /opt/movve/bin/driver-service
          
          # Copy migrations and env
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S rm -rf /opt/movve/driver/migrations
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp -r apps/driver/migrations /opt/movve/driver/migrations
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp /opt/movve/.env /opt/movve/driver/.env

      - name: Run Diesel migrations on VPS
        run: |
          source /opt/movve/.env
          export DRIVER_DATABASE_URL=$DRIVER_DATABASE_URL
          
          diesel migration run --migration-dir /opt/movve/driver/migrations --database-url $DRIVER_DATABASE_URL

      - name: Start driver service
        run: echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl start movve-driver

      - name: Wait for driver service to be healthy
        run: |
          for i in {1..10}; do
            if echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl is-active movve-driver --quiet; then
              if echo "${{ secrets.VPS_PASSWORD }}" | sudo -S ss -tlnp | grep -q ":8002"; then
                echo "✅ Driver service is healthy"
                break
              fi
            fi
            echo "⏳ Waiting... attempt $i/10"
            sleep 3
          done

      - name: Restart dependent services
        run: |
          echo "🔄 Restarting gateway and tunnel..."
          # Restart in parallel
          (echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl restart movve-gateway) &
          (sleep 1 && echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl restart cloudflared-movve) &
          wait
          echo "✅ All services restarted"

      - name: Verify full stack health
        run: |
          sleep 3  # Reduced from 5 to 3 seconds
          echo "Checking all services..."
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl is-active movve-driver movve-gateway cloudflared-movve --quiet && \
          echo "✅ All services are active" || \
          (echo "❌ Some services failed" && \
           echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl status movve-driver movve-gateway cloudflared-movve --no-pager && \
           exit 1)