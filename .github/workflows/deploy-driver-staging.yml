name: Deploy Driver Service - Staging

on:
  push:
    branches: [ "staging" ]
    paths:
      - 'apps/driver/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source $HOME/.cargo/env
          rustup default stable
          # (optional) install common components
          rustup component add clippy rustfmt || true

      
      - name: Build driver-service in release mode
        run: |
          source $HOME/.cargo/env
          cargo build --release --bin driver
      
      - name: Stop driver service
        run: sudo systemctl stop movve-driver
      
      - name: Copy binary to deployment location
        run: |
          sudo mkdir -p /opt/movve/bin
          sudo cp target/release/driver /opt/movve/bin/
          sudo chmod +x /opt/movve/bin/driver
      
      - name: Start driver service
        run: sudo systemctl start movve-driver
      
      - name: Wait for service to start
        run: sleep 3
      
      - name: Check service status
        run: sudo systemctl status movve-driver --no-pager