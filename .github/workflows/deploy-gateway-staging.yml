name: Deploy Gateway - Staging

on:
  push:
    branches: [ "staging" ]
    paths:
      - 'apps/gateway/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-gateway-staging.yml'

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Rust environment
        run: |
          if [ ! -f "$HOME/.cargo/env" ]; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y
          fi
          source $HOME/.cargo/env
          rustc --version
          cargo --version
      
      - name: Build gateway in release mode
        run: |
          source $HOME/.cargo/env
          cargo build --release --bin gateway
      
      - name: Stop gateway service
        run: echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl stop movve-gateway || true
      
      - name: Copy binary to deployment location
        run: |
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p /opt/movve/bin
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp target/release/gateway /opt/movve/bin/
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x /opt/movve/bin/gateway
      
      - name: Start gateway service
        run: echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl start movve-gateway
      
      - name: Restart cloudflare tunnel
        run: |
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl restart cloudflared-movve
          sleep 5

      - name: Verify tunnel connectivity
        run: curl -f https://staging.movve.xyz/ || echo "Warning Tunnel not immediately available"
      
      - name: Check service status
        run: echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl status movve-gateway --no-pager
      
      - name: Health check
        run: curl -f http://localhost:8000/health || exit 1