name: Deploy Gateway - Staging

on:
  push:
    branches: [ "staging" ]
    paths:
      - 'apps/gateway/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-gateway-staging.yml'

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup Rust environment
        run: |
          if [ ! -f "$HOME/.cargo/env" ]; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y
          fi
          source $HOME/.cargo/env
          rustc --version
          cargo --version

      - name: Ensure incremental build
        run: |
          source $HOME/.cargo/env
          export CARGO_INCREMENTAL=1
      
      - name: Build gateway in release mode
        run: |
          source $HOME/.cargo/env
          cargo build --release --bin gateway
      
      - name: Stop gateway service
        run: echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl stop movve-gateway || true
      
      - name: Copy binary to deployment location
        run: |
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S mkdir -p /opt/movve/bin
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S cp target/release/gateway /opt/movve/bin/
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S chmod +x /opt/movve/bin/gateway
      
      - name: Start gateway service
        run: echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl start movve-gateway

      - name: Wait for gateway to be healthy
        run: |
          for i in {1..10}; do
            if echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl is-active movve-gateway --quiet; then
              if echo "${{ secrets.VPS_PASSWORD }}" | sudo -S ss -tlnp | grep -q ":8000"; then
                echo "✅ Gateway is healthy"
                break
              fi
            fi
            echo "⏳ Waiting... attempt $i/10"
            sleep 3
          done

      - name: Restart Cloudflare tunnel
        run: |
          echo "🔄 Restarting Cloudflare tunnel..."
          echo "${{ secrets.VPS_PASSWORD }}" | sudo -S systemctl restart cloudflared-movve
          sleep 5
          echo "✅ Tunnel restarted"

      - name: Verify connectivity
        run: |
          echo "Testing external connectivity..."
          for i in {1..5}; do
            if curl -sf https://staging.movve.xyz/ > /dev/null 2>&1; then
              echo "✅ Public endpoint is accessible"
              exit 0
            fi
            echo "⏳ Waiting for tunnel... attempt $i/5"
            sleep 5
          done
          echo "⚠️ Could not verify public endpoint, but deployment complete"