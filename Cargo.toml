[workspace]
resolver = "3"
members = [
    "apps/auth",
    "apps/driver",
    "apps/gateway",
    "apps/rider",
    "libs/common",
    "libs/utils",
]

[workspace.dependencies]
tokio = { version = "1.48.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "rustls-tls", "multipart"] }
axum = { version = "0.8.6", features = ["ws", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.145"
uuid = { version = "1.1.18", features = ["v4", "serde"] }
bcrypt = "0.17.1"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
anyhow = "1.0"
dotenvy = "0.15.7"
chrono = { version = "0.4.42", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
utoipa = { version = "5.4.0", features = ["macros", "axum_extras", "chrono", "uuid", "decimal"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
rand = "0.9.2"
sha1 = "0.10.6"
hex = "0.4.3"





