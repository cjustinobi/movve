
# -------------------------------------------------------------------
# 🚀 GLOBAL CONFIG
# -------------------------------------------------------------------

[config]
default_to_workspace = false
skip_core_tasks = true


[env]
DATABASE_URL = "postgres://justin:postgres@localhost:5432/movve_auth"
DRIVER_DATABASE_URL = "postgres://justin:postgres@localhost:5432/movve_driver"
#DATABASE_URL = "postgresql://postgres:NYOYFXLoxm0ywnvu@db.miaafrdvcvxakvfvjfpx.supabase.co:5432/postgres"

RUST_LOG = "info"

# ==============================================================================
# Development Tasks
# ==============================================================================

[tasks.dev]
description = "Run all services in development mode"
dependencies = ["dev-auth", "dev-gateway", "dev-driver"]

[tasks.dev-auth]
description = "Run auth service in development"
cwd = "apps/auth"
command = "cargo"
args = ["run"]
watch = { watch = ["apps/auth/src", "libs/common/src", "libs/utils/src"] }

[tasks.dev-gateway]
description = "Run gateway service in development"
cwd = "apps/gateway"
command = "cargo"
args = ["run"]
watch = { watch = ["apps/gateway/src", "libs/common/src", "libs/utils/src"] }

[tasks.dev-driver]
description = "Run driver service in development"
cwd = "apps/driver"
command = "cargo"
args = ["run"]
watch = { watch = ["apps/driver/src", "libs/common/src", "libs/utils/src"] }

# ==============================================================================
# Build Tasks
# ==============================================================================

[tasks.build]
description = "Build all services"
command = "cargo"
args = ["build", "--workspace"]

[tasks.build-release]
description = "Build all services in release mode"
command = "cargo"
args = ["build", "--workspace", "--release"]

[tasks.build-auth]
description = "Build auth service"
cwd = "apps/auth"
command = "cargo"
args = ["build"]

[tasks.build-gateway]
description = "Build gateway service"
cwd = "apps/gateway"
command = "cargo"
args = ["build"]

[tasks.build-driver]
description = "Build driver service"
cwd = "apps/driver"
command = "cargo"
args = ["build"]


# -------------------------------------------------------------------
# 🔍 DATABASE STATUS CHECK
# -------------------------------------------------------------------
[tasks.dbs-status]
description = "Check PostgreSQL connection for both databases"
script = [
    "echo 'Checking Auth DB connection...'",
    "pg_isready -d ${DATABASE_URL}",
    "echo ''",
    "echo 'Checking Driver DB connection...'",
    "pg_isready -d ${DRIVER_DATABASE_URL}"
]

# -------------------------------------------------------------------
# 🧩 APP SETUP (Diesel)
# -------------------------------------------------------------------

[tasks.setup]
description = "Initial setup for Movve application"
dependencies = ["diesel-auth-setup", "diesel-driver-setup"]

[tasks.db-reset]
description = "Drop and recreate all DBs"
dependencies = ["diesel-auth-reset", "diesel-driver-reset"]

# -------------------------------------------------------------------
# 🧩 AUTH SERVICE (Diesel)
# -------------------------------------------------------------------
[tasks.diesel-auth-setup]
description = "Setup and migrate Auth DB"
script = [
    "echo '🚀 Setting up Auth database...'",
    "diesel setup --database-url ${DATABASE_URL} --migration-dir apps/auth/migrations"
]

[tasks.diesel-auth-migrate]
description = "Run pending Auth migrations"
script = [
    "diesel migration run --database-url ${DATABASE_URL} --migration-dir apps/auth/migrations"
]

[tasks.diesel-auth-revert]
description = "Revert last Auth migration"
script = [
    "diesel migration revert --database-url ${DATABASE_URL} --migration-dir apps/auth/migrations"
]

[tasks.diesel-auth-reset]
description = "Drop and recreate Auth DB, then run migrations"
script = [
    "diesel database reset --database-url ${DATABASE_URL} --migration-dir apps/auth/migrations"
]

# -------------------------------------------------------------------
# 🚗 DRIVER SERVICE (Diesel)
# -------------------------------------------------------------------
[tasks.diesel-driver-setup]
description = "Setup and migrate Driver DB"
script = [
    "echo '🚀 Setting up Driver database...'",
    "diesel setup --database-url ${DRIVER_DATABASE_URL} --migration-dir apps/driver/migrations"
]

[tasks.diesel-driver-migrate]
description = "Run pending Driver migrations"
script = [
    "diesel migration run --database-url ${DRIVER_DATABASE_URL} --migration-dir apps/driver/migrations"
]

[tasks.diesel-driver-revert]
description = "Revert last Driver migration"
script = [
    "diesel migration revert --database-url ${DRIVER_DATABASE_URL} --migration-dir apps/driver/migrations"
]

[tasks.diesel-driver-reset]
description = "Drop and recreate Driver DB, then run migrations"
script = [
    "diesel database reset --database-url ${DRIVER_DATABASE_URL} --migration-dir apps/driver/migrations"
]


# ==============================================================================
# Database Shell (with psql installation check)
# ==============================================================================

[tasks.db-shell]
description = "Connect to Supabase database shell"
script = '''
#!/bin/bash
if ! command -v psql &> /dev/null; then
    echo "❌ psql is not installed."
    echo ""
    echo "To install psql:"
    if [[ "$OSTYPE" == "darwin"* ]]; then
        echo "  brew install postgresql@15"
    elif [[ "$OSTYPE" == "linux-gnu"* ]]; then
        echo "  sudo apt-get install postgresql-client  # Ubuntu/Debian"
        echo "  sudo yum install postgresql             # RHEL/CentOS"
    else
        echo "  Please install PostgreSQL client for your system"
    fi
    echo ""
    echo "Or use Supabase Studio: https://app.supabase.com/project/[YOUR-PROJECT]/editor"
    exit 1
fi

if [ -z "$DATABASE_URL" ]; then
    echo "❌ DATABASE_URL not set in .env"
    exit 1
fi

psql "${DATABASE_URL}"
'''

[tasks.db-query]
description = "Execute a SQL query"
script = '''
#!/bin/bash
if ! command -v psql &> /dev/null; then
    echo "❌ psql is not installed. Use 'cargo make db-shell' for installation instructions."
    exit 1
fi

if [ -z "$SQL" ]; then
  echo "Usage: SQL='SELECT * FROM users' cargo make db-query"
  exit 1
fi

psql "${DATABASE_URL}" -c "$SQL"
'''

[tasks.db-query-file]
description = "Execute SQL from a file"
script = '''
#!/bin/bash
if ! command -v psql &> /dev/null; then
    echo "❌ psql is not installed. Use 'cargo make db-shell' for installation instructions."
    exit 1
fi

if [ -z "$SQL_FILE" ]; then
  echo "Usage: SQL_FILE=path/to/query.sql cargo make db-query-file"
  exit 1
fi

if [ ! -f "$SQL_FILE" ]; then
    echo "❌ File not found: $SQL_FILE"
    exit 1
fi

psql "${DATABASE_URL}" -f "$SQL_FILE"
'''

# ==============================================================================
# Database Backup & Restore (with pg_dump check)
# ==============================================================================

[tasks.db-backup]
description = "Backup database to SQL file"
script = '''
#!/bin/bash
if ! command -v pg_dump &> /dev/null; then
    echo "❌ pg_dump is not installed."
    echo ""
    echo "To install PostgreSQL tools:"
    if [[ "$OSTYPE" == "darwin"* ]]; then
        echo "  brew install postgresql@18"
    elif [[ "$OSTYPE" == "linux-gnu"* ]]; then
        echo "  sudo apt-get install postgresql-client  # Ubuntu/Debian"
        echo "  sudo yum install postgresql             # RHEL/CentOS"
    fi
    echo ""
    echo "Or use Supabase Dashboard: https://app.supabase.com/project/[YOUR-PROJECT]/database/backups"
    exit 1
fi

TIMESTAMP=$(date +%Y%m%d_%H%M%S)
BACKUP_FILE="backups/backup_${TIMESTAMP}.sql"
mkdir -p backups
echo "Creating backup..."
pg_dump "${DATABASE_URL}" > $BACKUP_FILE
echo "✅ Backup saved to $BACKUP_FILE"
'''

[tasks.db-restore]
description = "Restore database from SQL file"
script = '''
#!/bin/bash
if ! command -v psql &> /dev/null; then
    echo "❌ psql is not installed. Use 'cargo make db-shell' for installation instructions."
    exit 1
fi

if [ -z "$BACKUP_FILE" ]; then
  echo "Usage: BACKUP_FILE=backups/backup_20240101_120000.sql cargo make db-restore"
  exit 1
fi

if [ ! -f "$BACKUP_FILE" ]; then
    echo "❌ Backup file not found: $BACKUP_FILE"
    exit 1
fi

echo "⚠️  WARNING: This will restore from $BACKUP_FILE"
echo "Are you sure? (type 'yes' to confirm)"
read -r confirm
if [ "$confirm" != "yes" ]; then
  echo "Aborted."
  exit 1
fi

psql "${DATABASE_URL}" < $BACKUP_FILE
echo "✅ Database restored from $BACKUP_FILE"
'''

# ==============================================================================
# Supabase CLI Tasks (Optional)
# ==============================================================================

[tasks.supabase-link]
description = "Link to Supabase project (requires Supabase CLI)"
script = '''
#!/bin/bash
if ! command -v supabase &> /dev/null; then
    echo "❌ Supabase CLI is not installed."
    echo ""
    echo "To install:"
    if [[ "$OSTYPE" == "darwin"* ]]; then
        echo "  brew install supabase/tap/supabase"
    else
        echo "  npm install -g supabase"
    fi
    echo ""
    echo "Or visit: https://supabase.com/docs/guides/cli"
    exit 1
fi

if [ -z "$SUPABASE_PROJECT_REF" ]; then
  echo "Usage: SUPABASE_PROJECT_REF=your_project_ref cargo make supabase-link"
  echo ""
  echo "Get your project ref from: https://app.supabase.com/project/[YOUR-PROJECT]/settings/general"
  exit 1
fi

supabase link --project-ref $SUPABASE_PROJECT_REF
'''

[tasks.supabase-status]
description = "Show Supabase project status"
script = '''
#!/bin/bash
if ! command -v supabase &> /dev/null; then
    echo "❌ Supabase CLI is not installed. Use 'cargo make supabase-link' for installation instructions."
    exit 1
fi

supabase projects list
'''

