echo "  watch-gateway    - Watch and run gateway service"
echo "  watch-driver     - Watch and run driver service"
echo "  run-all          - Run all services in tmux"
echo ""
echo "Build:"
echo "  build            - Build all services"
echo "  build-release    - Build all services (release)"
echo ""
echo "Database:"
echo "  db-create        - Create database"
echo "  db-drop          - Drop database"
echo "  db-reset         - Reset database"
echo "  db-migrate       - Run all migrations"
echo "  db-setup         - Complete database setup"
echo ""
echo "Testing:"
echo "  test             - Run all tests"
echo "  test-auth        - Run auth tests"
