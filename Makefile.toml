# ==============================================================================
# Run Multiple Services (using tmux or separate terminals)
# ==============================================================================

[tasks.run-all]
description = "Run all services (requires tmux, auto-installs if missing)"
script = '''
#!/bin/bash
set -e

echo "Starting all services in tmux with live reload..."

# --- Check for tmux ---
if ! command -v tmux >/dev/null 2>&1; then
  echo "⚠️  tmux not found. Installing..."

  if [[ "$OSTYPE" == "darwin"* ]]; then
    if command -v brew >/dev/null 2>&1; then
      brew install tmux
    else
      echo "❌ Homebrew not found. Please install tmux manually: https://brew.sh"
      exit 1
    fi
  elif command -v apt-get >/dev/null 2>&1; then
    sudo apt-get update && sudo apt-get install -y tmux
  elif command -v yum >/dev/null 2>&1; then
    sudo yum install -y tmux
  else
    echo "❌ Unable to install tmux automatically. Please install it manually."
    exit 1
  fi
else
  echo "✅ tmux found."
fi

# --- Start tmux session ---
SESSION="movve"

# Kill existing session if it exists (avoid "duplicate session" errors)
tmux has-session -t $SESSION 2>/dev/null && tmux kill-session -t $SESSION

tmux new-session -d -s $SESSION

tmux split-window -h -t $SESSION
tmux split-window -v -t $SESSION:0.0
tmux split-window -v -t $SESSION:0.2

tmux send-keys -t $SESSION:0.0 'cd apps/auth && cargo watch -w src  -w ../../libs/services/src -w ../../libs/common/src -w ../../libs/utils/src -x "run --bin auth"' C-m
tmux send-keys -t $SESSION:0.1 'cd apps/gateway && cargo watch -w src  -w ../../libs/services/src -w ../../libs/common/src -w ../../libs/utils/src -x "run --bin gateway"' C-m
tmux send-keys -t $SESSION:0.2 'cd apps/driver && cargo watch -w src  -w ../../libs/services/src -w ../../libs/common/src -w ../../libs/utils/src -x "run --bin driver"' C-m
tmux send-keys -t $SESSION:0.3 'echo "🚀 All services started. Press Ctrl+B then D to detach."' C-m

tmux attach -t $SESSION
'''


[tasks.stop-all]
description = "Stop all running services and free ports"
script = '''
#!/bin/bash
set +e  # Don't exit on error

echo "Stopping tmux session..."
tmux kill-session -t movve 2>/dev/null && echo "✓ Tmux session killed" || echo "ℹ No tmux session found"

echo ""
echo "Freeing ports..."

PORTS="${APP_PORT} ${AUTH_PORT} ${DRIVER_PORT}"

for port in $PORTS; do
    pid=$(lsof -ti:$port 2>/dev/null)
    if [ ! -z "$pid" ]; then
        echo "  Killing process on port $port (PID: $pid)"
        kill -9 $pid 2>/dev/null
        sleep 0.5
    fi
done

echo ""
echo "Port status:"
all_free=true
for port in $PORTS; do
    if lsof -ti:$port >/dev/null 2>&1; then
        echo "  ⚠️  Port $port still in use"
        all_free=false
    else
        echo "  ✓ Port $port is free"
    fi
done

if [ "$all_free" = true ]; then
    echo ""
    echo "✅ All services stopped successfully"
else
    echo ""
    echo "⚠️  Some ports are still in use. You may need to manually kill processes."
fi
'''

[tasks.stop-service]
description = "Stop a single service running in tmux (usage: cargo make stop-service --service=<name>)"
script = '''
#!/bin/bash
SERVICE="${1:-}"
SESSION="movve"

if [ -z "$SERVICE" ]; then
  echo "Usage: cargo make stop-service -- <service_name>"
  echo "Example: cargo make stop-service -- auth"
  exit 1
fi

# Find the pane running the service
PANE_ID=$(tmux list-panes -t $SESSION -F '#{pane_id} #{pane_current_command} #{pane_current_path}' | grep "apps/$SERVICE" | awk '{print $1}')

if [ -z "$PANE_ID" ]; then
  echo "No running service found for '$SERVICE' in session '$SESSION'."
  exit 1
fi

# Kill that specific pane
tmux kill-pane -t "$PANE_ID"
echo "Stopped service '$SERVICE' in tmux session '$SESSION'."
'''



[tasks.help]
category = "chore"
description = "Show available tasks grouped by category"
script = '''
#!/bin/bash

echo "============================================================"
echo "🦀 MOVVE MONOREPO — TASKS"
echo "============================================================"
echo ""

list_tasks () {
  cargo make --list-all-steps | sed 's/^/- /'
}

print_group () {
  TITLE=$1
  PATTERN=$2

  echo "▶ $TITLE"
  cargo make --list-all-steps | grep -E "$PATTERN" | sed 's/^/  - /'
  echo ""
}

print_group "🚀 Dev" "^dev(-|$)"
print_group "🗄️  Database" "^db-"
print_group "🌱 Seed" "^seed(-|$)"
print_group "🐘 Diesel" "^diesel-"
print_group "🐳 Docker" "^docker-"
print_group "🧪 Tests" "^test(-|$)"
print_group "👀 Watch" "^watch-"

# ✅ Missing global commands (explicitly included)
print_group "⚙️  Global" "^(run-all|stop-all)$"

print_group "🧹 Chore" "^(fmt|clippy|check|clean|audit|ci|lint|deps|tree|bloat)$"

echo "============================================================"
echo "📦 All Tasks (Uncategorized / Safety Net)"
echo "------------------------------------------------------------"
list_tasks

echo "============================================================"
echo "💡 Usage: cargo make <task-name>"
echo "============================================================"
'''
