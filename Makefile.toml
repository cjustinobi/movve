# -------------------------------------------------------------------
# 🚀 GLOBAL CONFIG
# -------------------------------------------------------------------

[config]
default_to_workspace = false
skip_core_tasks = true

[env]
APP_PORT = 8000
AUTH_PORT = 8001
DRIVER_PORT = 8002
AUTH_DATABASE_URL = "postgres://justin:postgres@localhost:5432/movve_auth"
DRIVER_DATABASE_URL = "postgres://justin:postgres@localhost:5432/movve_driver"
RUST_LOG = "info"

# ==============================================================================
# DEV
# ==============================================================================

[tasks.dev]
category = "dev"
description = "Run all services in development mode"
dependencies = ["dev-auth", "dev-gateway", "dev-driver"]

[tasks.dev-auth]
category = "dev"
description = "Run auth service in development"
cwd = "apps/auth"
command = "cargo"
args = ["run", "--bin", "auth"]
watch = { watch = ["apps/auth/src", "libs/common/src", "libs/utils/src", "libs/services/src"] }

[tasks.dev-gateway]
category = "dev"
description = "Run gateway service in development"
cwd = "apps/gateway"
command = "cargo"
args = ["run", "--bin", "gateway"]
watch = { watch = ["apps/gateway/src", "libs/common/src", "libs/utils/src", "libs/services/src"] }

[tasks.dev-driver]
category = "dev"
description = "Run driver service in development"
cwd = "apps/driver"
command = "cargo"
args = ["run", "--bin", "driver"]
watch = { watch = ["apps/driver/src", "libs/common/src", "libs/utils/src", "libs/services/src"] }

# ==============================================================================
# DIESEL
# ==============================================================================

[tasks.setup]
category = "diesel"
description = "Initial setup for Movve application"
dependencies = ["diesel-auth-setup", "diesel-driver-setup"]

[tasks.db-reset]
category = "diesel"
description = "Drop and recreate all DBs"
dependencies = ["diesel-auth-reset", "diesel-driver-reset"]

[tasks.diesel-auth-setup]
category = "diesel"
description = "Setup and migrate Auth DB"
script = [
  "echo '🚀 Setting up Auth database...'",
  "diesel setup --database-url ${AUTH_DATABASE_URL} --migration-dir apps/auth/migrations"
]

[tasks.diesel-auth-migrate]
category = "diesel"
description = "Run pending Auth migrations"
script = [
  "diesel migration run --database-url ${AUTH_DATABASE_URL} --migration-dir apps/auth/migrations"
]

[tasks.diesel-auth-revert]
category = "diesel"
description = "Revert last Auth migration"
script = [
  "diesel migration revert --database-url ${AUTH_DATABASE_URL} --migration-dir apps/auth/migrations"
]

[tasks.diesel-auth-reset]
category = "diesel"
description = "Reset Auth DB"
script = [
  "diesel database reset --database-url ${AUTH_DATABASE_URL} --migration-dir apps/auth/migrations"
]

[tasks.diesel-driver-setup]
category = "diesel"
description = "Setup and migrate Driver DB"
script = [
  "echo '🚀 Setting up Driver database...'",
  "diesel setup --database-url ${DRIVER_DATABASE_URL} --migration-dir apps/driver/migrations"
]

[tasks.diesel-driver-migrate]
category = "diesel"
description = "Run pending Driver migrations"
script = [
  "diesel migration run --database-url ${DRIVER_DATABASE_URL} --migration-dir apps/driver/migrations"
]

[tasks.diesel-driver-revert]
category = "diesel"
description = "Revert last Driver migration"
script = [
  "diesel migration revert --database-url ${DRIVER_DATABASE_URL} --migration-dir apps/driver/migrations"
]

[tasks.diesel-driver-reset]
category = "diesel"
description = "Reset Driver DB"
script = [
  "diesel database reset --database-url ${DRIVER_DATABASE_URL} --migration-dir apps/driver/migrations"
]

[tasks.diesel-driver-schema]
category = "diesel"
script = '''
cd apps/driver
diesel print-schema --database-url "${DRIVER_DATABASE_URL}" > src/schema.rs
'''

