args = ["watch", "-w", "apps/auth/src", "-w", "libs/common/src", "-w", "libs/utils/src", "-x", "run --bin auth"]

[tasks.watch-gateway]
description = "Watch and run gateway service"
install_crate = { crate_name = "cargo-watch", binary = "cargo-watch", test_arg = "--version" }
command = "cargo"
args = ["watch", "-w", "apps/gateway/src", "-w", "libs/common/src", "-w", "libs/utils/src", "-x", "run --bin gateway"]

[tasks.watch-driver]
description = "Watch and run driver service"
install_crate = { crate_name = "cargo-watch", binary = "cargo-watch", test_arg = "--version" }
command = "cargo"
args = ["watch", "-w", "apps/driver/src", "-w", "libs/common/src", "-w", "libs/utils/src", "-x", "run --bin driver"]

