description = "Drop and recreate the shared DB, then migrate all services"
script = [
  "diesel database reset --database-url ${DATABASE_URL} --migration-dir apps/auth/migrations",
  "diesel migration run --database-url ${DATABASE_URL} --migration-dir apps/driver/migrations",
  "diesel migration run --database-url ${DATABASE_URL} --migration-dir apps/rider/migrations",
  "diesel migration run --database-url ${DATABASE_URL} --migration-dir apps/admin/migrations"
