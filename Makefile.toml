# -------------------------------------------------------------------
# 🚀 GLOBAL CONFIG
# -------------------------------------------------------------------

[config]
default_to_workspace = false
skip_core_tasks = true

[env]
APP_PORT = 8000
AUTH_PORT = 8001
DRIVER_PORT = 8002
RIDER_PORT = 8003
ADMIN_PORT = 8004

DATABASE_URL = "postgres://justin:cejowisz@localhost:5432/movve_shared"
AUTH_DATABASE_URL = "${DATABASE_URL}"
DRIVER_DATABASE_URL = "${DATABASE_URL}"
RIDER_DATABASE_URL = "${DATABASE_URL}"
ADMIN_DATABASE_URL = "${DATABASE_URL}"

RUST_LOG = "info"

# ==============================================================================
# DEV
# ==============================================================================

[tasks.dev]
category = "dev"
description = "Run all services in development mode"
dependencies = ["dev-auth", "dev-gateway", "dev-driver", "dev-rider", "dev-admin"]

[tasks.dev-auth]
category = "dev"
description = "Run auth service in development"
cwd = "apps/auth"
command = "cargo"
args = ["run", "--bin", "auth"]
watch = { watch = ["apps/auth/src", "libs/common/src", "libs/utils/src", "libs/services/src"] }

[tasks.dev-gateway]
category = "dev"
description = "Run gateway service in development"
cwd = "apps/gateway"
command = "cargo"
args = ["run", "--bin", "gateway"]
watch = { watch = ["apps/gateway/src", "libs/common/src", "libs/utils/src", "libs/services/src"] }

[tasks.dev-driver]
category = "dev"
description = "Run driver service in development"
cwd = "apps/driver"
command = "cargo"
args = ["run", "--bin", "driver"]
watch = { watch = ["apps/driver/src", "libs/common/src", "libs/utils/src", "libs/services/src"] }

[tasks.dev-rider]
category = "dev"
description = "Run rider service in development"
cwd = "apps/rider"
command = "cargo"
args = ["run", "--bin", "rider"]
watch = { watch = ["apps/rider/src", "libs/common/src", "libs/utils/src", "libs/services/src"] }

[tasks.dev-admin]
