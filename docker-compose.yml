version: '3.8'

services:
  user_service:
    build:
      context: ../services/user_service
      dockerfile: Dockerfile 
    ports:
      - "8001:8001"
    env_file: ../.env
    depends_on:
      - postgres_db
    networks:
      - ride_network

  driver_service:
    build:
      context: ../services/driver_service
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file: ../.env
    depends_on:
      - postgres_db
      - redis
    networks:
      - ride_network

  ride_service:
    build:
      context: ../services/ride_service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    env_file: ../.env
    depends_on:
      - postgres_db
      - redis
      - rabbitmq
    networks:
      - ride_network

  location_service:
    build:
      context: ../services/location_service
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    env_file: ../.env
    depends_on:
      - redis
    networks:
      - ride_network

  payment_service:
    build:
      context: ../services/payment_service
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    env_file: ../.env
    depends_on:
      - postgres_db
      - rabbitmq
    networks:
      - ride_network

  notification_service:
    build:
      context: ../services/notification_service
      dockerfile: Dockerfile
    ports:
      - "8006:8006"
    env_file: ../.env
    depends_on:
      - rabbitmq
    networks:
      - ride_network

  postgres_db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ride_hailing_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - ride_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ride_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - ride_network

networks:
  ride_network:

volumes:
  postgres_data:
  redis_data: